<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Phoenix — Your multilingual AI voice companion.">
    <title>Phoenix — AI Voice Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- PARTICLE CANVAS -->
    <canvas id="particleCanvas"></canvas>

    <!-- WELCOME SPLASH -->
    <div id="welcomeSplash" class="welcome-splash">
        <div class="splash-card">
            <div class="splash-phoenix-orb">
                <div class="orb-ring orb-ring-1"></div>
                <div class="orb-ring orb-ring-2"></div>
                <div class="orb-ring orb-ring-3"></div>
                <div class="orb-core">
                    <svg viewBox="0 0 64 64" fill="none">
                        <path d="M32 4C28 12 16 18 14 28C12 38 20 48 32 56C44 48 52 38 50 28C48 18 36 12 32 4Z" fill="url(#fg1)" />
                        <path d="M32 16C30 22 24 26 23 32C22 38 26 44 32 48C38 44 42 38 41 32C40 26 34 22 32 16Z" fill="url(#ig1)" opacity="0.8"/>
                        <defs>
                            <linearGradient id="fg1" x1="32" y1="4" x2="32" y2="56" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#FFD700"/><stop offset="0.5" stop-color="#FF6B35"/><stop offset="1" stop-color="#FF2D2D"/>
                            </linearGradient>
                            <linearGradient id="ig1" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#FFF7AE"/><stop offset="1" stop-color="#FFB347"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>
            <h1 class="splash-title">Phoenix</h1>
            <p class="splash-tagline">Your multilingual voice companion</p>
            <div class="splash-features">
                <span>🎙️ Voice-First</span>
                <span>🌍 Multi-Language</span>
                <span>🌤️ Weather</span>
                <span>🎮 Games</span>
            </div>
            <div class="splash-form">
                <label for="nameInput">What should I call you?</label>
                <input type="text" id="nameInput" placeholder="Your name..." autocomplete="off" spellcheck="false" maxlength="30">
                <button id="startBtn" class="start-btn" disabled>
                    <span>Ignite Phoenix</span>
                    <div class="btn-fire-particles"><i></i><i></i><i></i><i></i><i></i></div>
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN VOICE SCREEN (voice-first) -->
    <div id="voiceScreen" class="voice-screen hidden">
        <!-- Central listening orb -->
        <div class="voice-orb-container">
            <div id="voiceOrb" class="voice-orb">
                <div class="voice-orb-glow"></div>
                <div class="voice-orb-rings">
                    <div class="v-ring v-ring-1"></div>
                    <div class="v-ring v-ring-2"></div>
                    <div class="v-ring v-ring-3"></div>
                </div>
                <div class="voice-orb-core">
                    <svg viewBox="0 0 64 64" fill="none">
                        <path d="M32 4C28 12 16 18 14 28C12 38 20 48 32 56C44 48 52 38 50 28C48 18 36 12 32 4Z" fill="url(#fg2)" />
                        <path d="M32 16C30 22 24 26 23 32C22 38 26 44 32 48C38 44 42 38 41 32C40 26 34 22 32 16Z" fill="url(#ig2)" opacity="0.8"/>
                        <defs>
                            <linearGradient id="fg2" x1="32" y1="4" x2="32" y2="56" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#FFD700"/><stop offset="0.5" stop-color="#FF6B35"/><stop offset="1" stop-color="#FF2D2D"/>
                            </linearGradient>
                            <linearGradient id="ig2" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#FFF7AE"/><stop offset="1" stop-color="#FFB347"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>
            <p id="voiceStatus" class="voice-status">Tap the orb to start talking</p>
            <p id="voiceTranscript" class="voice-transcript"></p>
        </div>

        <!-- Bottom toolbar -->
        <div class="voice-toolbar">
            <button id="muteBtnMain" class="toolbar-btn" title="Mute voice">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
                <span>Sound</span>
            </button>
            <button id="openChatBtn" class="toolbar-btn chat-toggle-btn" title="Switch to chat">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                <span>Chat</span>
            </button>
            <button id="langIndicator" class="toolbar-btn" title="Detected language">
                <span class="lang-flag">🌍</span>
                <span id="langLabel">EN</span>
            </button>
        </div>
    </div>

    <!-- CHAT PANEL (secondary, opens via button) -->
    <div id="chatPanel" class="chat-panel">
        <div class="chat-header">
            <div class="chat-header-left">
                <div class="header-avatar">
                    <svg viewBox="0 0 64 64" fill="none"><path d="M32 4C28 12 16 18 14 28C12 38 20 48 32 56C44 48 52 38 50 28C48 18 36 12 32 4Z" fill="url(#fg3)"/><path d="M32 16C30 22 24 26 23 32C22 38 26 44 32 48C38 44 42 38 41 32C40 26 34 22 32 16Z" fill="url(#ig3)" opacity="0.8"/><defs><linearGradient id="fg3" x1="32" y1="4" x2="32" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#FFD700"/><stop offset="0.5" stop-color="#FF6B35"/><stop offset="1" stop-color="#FF2D2D"/></linearGradient><linearGradient id="ig3" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF7AE"/><stop offset="1" stop-color="#FFB347"/></linearGradient></defs></svg>
                </div>
                <div class="header-info">
                    <h2>Phoenix</h2>
                    <div class="status-row">
                        <span class="status-dot"></span>
                        <span class="status-text" id="statusText">Online</span>
                    </div>
                </div>
            </div>
            <div class="chat-header-right">
                <button id="muteSpeechBtn" class="header-action-btn" title="Mute voice">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 010 7.07"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
                </button>
                <button id="clearChatBtn" class="header-action-btn" title="Clear chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/></svg>
                </button>
                <button id="closePanelBtn" class="header-action-btn" title="Back to voice">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
        </div>

        <div id="messagesArea" class="messages-area"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="textInput" placeholder="Type a message..." rows="1"></textarea>
                <div class="input-actions">
                    <button id="sendBtn" class="send-btn" disabled title="Send">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
